name: Sync Template App

on:
  push:
    branches:
      - agent/update-template-app
    paths:
      - .github/workflows/sync-template-app.yml
      - scripts/build-template-app.sh
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main website branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/update-template-app

      - name: Checkout latest approved Template App source
        uses: actions/checkout@v4
        with:
          repository: templateapp67-oss/NEW-TAMPLETE-APP
          ref: 082f2ff60d65803bbe991934946e73bfbd93f4a7
          path: .template-source

      - name: Replace embedded Template App source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf template-app
          mkdir -p template-app
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.local' \
            .template-source/ template-app/
          rm -rf .template-source

      - name: Wire canonical Nexora auth
        shell: bash
        run: |
          set -euo pipefail
          cp integration-packages/template-app/files/src/lib/supabaseClient.ts template-app/src/lib/supabaseClient.ts
          rm -rf template-app/vendor/auth
          mkdir -p template-app/vendor/auth
          cp -R packages/auth/. template-app/vendor/auth/

      - name: Configure isolated embedded Template App
        shell: node {0}
        run: |
          const fs = require('fs');

          const rootPath = 'package.json';
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          root.workspaces = (root.workspaces || []).filter((item) => item !== 'template-app');
          root.scripts['build:template-app'] = 'sh scripts/build-template-app.sh';
          root.scripts.prebuild = 'npm run build:job-portal && npm run build:template-app';
          root.scripts['prebuild:next'] = 'npm run build:job-portal && npm run build:template-app';
          fs.writeFileSync(rootPath, JSON.stringify(root, null, 2) + '\n');

          const appPath = 'template-app/package.json';
          const app = JSON.parse(fs.readFileSync(appPath, 'utf8'));
          app.name = '@nexora/template-app';
          app.dependencies = app.dependencies || {};
          app.dependencies['@nexora/auth'] = 'file:./vendor/auth';
          fs.writeFileSync(appPath, JSON.stringify(app, null, 2) + '\n');

          const vitePath = 'template-app/vite.config.ts';
          let vite = fs.readFileSync(vitePath, 'utf8');
          if (!vite.includes("base: '/template-app/'")) {
            vite = vite.replace('return {\n    plugins:', "return {\n    base: '/template-app/',\n    plugins:");
          }
          fs.writeFileSync(vitePath, vite);

      - name: Refresh and install Template App dependencies
        run: |
          npm --prefix template-app install --package-lock-only --ignore-scripts
          npm --prefix template-app ci --ignore-scripts

      - name: Validate updated Template App
        run: |
          npm --prefix template-app run test:phase-10
          (cd template-app && node verify-22-screens.js)
          npm --prefix template-app run build
          grep -q "@nexora/auth" template-app/src/lib/supabaseClient.ts
          grep -q "qwaehqsmodekbgvnaavz" template-app/vendor/auth/src/env.ts

      - name: Install and validate Main Website
        run: |
          npm ci
          npm run typecheck
          npm run test:contracts
          npm run build:next

      - name: Commit synced app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add template-app package.json scripts/build-template-app.sh .github/workflows/sync-template-app.yml
          if git diff --cached --quiet; then
            echo 'No sync changes to commit.'
            exit 0
          fi
          git commit -m 'feat: replace Template App with latest five-theme build [template-sync]'
          git push origin HEAD:agent/update-template-app
