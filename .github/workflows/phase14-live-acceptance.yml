name: Phase 14 — Live Acceptance Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  deployments: write

jobs:
  validate-environment:
    name: Validate Environment
    runs-on: ubuntu-latest
    outputs:
      environment_ready: ${{ steps.validate.outputs.ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate acceptance environment
        id: validate
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.ACCEPTANCE_SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.ACCEPTANCE_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.ACCEPTANCE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.ACCEPTANCE_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ACCEPTANCE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ACCEPTANCE_SUPABASE_PUBLISHABLE_KEY }}
          ACCEPTANCE_BASE_URL: ${{ secrets.ACCEPTANCE_BASE_URL }}
          ACCEPTANCE_CUSTOMER_A_EMAIL: ${{ secrets.ACCEPTANCE_CUSTOMER_A_EMAIL }}
          ACCEPTANCE_CUSTOMER_A_PASSWORD: ${{ secrets.ACCEPTANCE_CUSTOMER_A_PASSWORD }}
          ACCEPTANCE_CUSTOMER_B_EMAIL: ${{ secrets.ACCEPTANCE_CUSTOMER_B_EMAIL }}
          ACCEPTANCE_CUSTOMER_B_PASSWORD: ${{ secrets.ACCEPTANCE_CUSTOMER_B_PASSWORD }}
          ACCEPTANCE_OWNER_A_EMAIL: ${{ secrets.ACCEPTANCE_OWNER_A_EMAIL }}
          ACCEPTANCE_OWNER_A_PASSWORD: ${{ secrets.ACCEPTANCE_OWNER_A_PASSWORD }}
          ACCEPTANCE_OWNER_B_EMAIL: ${{ secrets.ACCEPTANCE_OWNER_B_EMAIL }}
          ACCEPTANCE_OWNER_B_PASSWORD: ${{ secrets.ACCEPTANCE_OWNER_B_PASSWORD }}
          ACCEPTANCE_PARTNER_A_EMAIL: ${{ secrets.ACCEPTANCE_PARTNER_A_EMAIL }}
          ACCEPTANCE_PARTNER_A_PASSWORD: ${{ secrets.ACCEPTANCE_PARTNER_A_PASSWORD }}
          ACCEPTANCE_PARTNER_B_EMAIL: ${{ secrets.ACCEPTANCE_PARTNER_B_EMAIL }}
          ACCEPTANCE_PARTNER_B_PASSWORD: ${{ secrets.ACCEPTANCE_PARTNER_B_PASSWORD }}
        run: |
          bash scripts/validate-acceptance-env.sh

      - name: Set environment ready output
        if: success()
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

  integration-tests:
    name: Phase 14 Integration Tests
    needs: validate-environment
    if: needs.validate-environment.outputs.environment_ready == 'true'
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Phase 14 integration tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.ACCEPTANCE_SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.ACCEPTANCE_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.ACCEPTANCE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.ACCEPTANCE_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ACCEPTANCE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ACCEPTANCE_SUPABASE_PUBLISHABLE_KEY }}
          ACCEPTANCE_BASE_URL: ${{ secrets.ACCEPTANCE_BASE_URL }}
          ACCEPTANCE_CUSTOMER_A_EMAIL: ${{ secrets.ACCEPTANCE_CUSTOMER_A_EMAIL }}
          ACCEPTANCE_CUSTOMER_A_PASSWORD: ${{ secrets.ACCEPTANCE_CUSTOMER_A_PASSWORD }}
          ACCEPTANCE_CUSTOMER_B_EMAIL: ${{ secrets.ACCEPTANCE_CUSTOMER_B_EMAIL }}
          ACCEPTANCE_CUSTOMER_B_PASSWORD: ${{ secrets.ACCEPTANCE_CUSTOMER_B_PASSWORD }}
          ACCEPTANCE_OWNER_A_EMAIL: ${{ secrets.ACCEPTANCE_OWNER_A_EMAIL }}
          ACCEPTANCE_OWNER_A_PASSWORD: ${{ secrets.ACCEPTANCE_OWNER_A_PASSWORD }}
          ACCEPTANCE_OWNER_B_EMAIL: ${{ secrets.ACCEPTANCE_OWNER_B_EMAIL }}
          ACCEPTANCE_OWNER_B_PASSWORD: ${{ secrets.ACCEPTANCE_OWNER_B_PASSWORD }}
          ACCEPTANCE_PARTNER_A_EMAIL: ${{ secrets.ACCEPTANCE_PARTNER_A_EMAIL }}
          ACCEPTANCE_PARTNER_A_PASSWORD: ${{ secrets.ACCEPTANCE_PARTNER_A_PASSWORD }}
          ACCEPTANCE_PARTNER_B_EMAIL: ${{ secrets.ACCEPTANCE_PARTNER_B_EMAIL }}
          ACCEPTANCE_PARTNER_B_PASSWORD: ${{ secrets.ACCEPTANCE_PARTNER_B_PASSWORD }}
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: ${{ secrets.PLAYWRIGHT_CHROMIUM_EXECUTABLE }}
        run: |
          bash scripts/run-phase14-integration.sh

      - name: Upload integration test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase14-integration-failures-${{ github.run_id }}
          path: test-results/
          retention-days: 7

  e2e-tests:
    name: Phase 14 E2E Tests
    needs: validate-environment
    if: needs.validate-environment.outputs.environment_ready == 'true'
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: ${{ secrets.PLAYWRIGHT_CHROMIUM_EXECUTABLE }}
        run: |
          if [[ -n "$PLAYWRIGHT_CHROMIUM_EXECUTABLE" ]]; then
            echo "Using system Chromium at: $PLAYWRIGHT_CHROMIUM_EXECUTABLE"
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run Phase 14 E2E tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.ACCEPTANCE_SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.ACCEPTANCE_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.ACCEPTANCE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.ACCEPTANCE_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ACCEPTANCE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ACCEPTANCE_SUPABASE_PUBLISHABLE_KEY }}
          ACCEPTANCE_BASE_URL: ${{ secrets.ACCEPTANCE_BASE_URL }}
          ACCEPTANCE_CUSTOMER_A_EMAIL: ${{ secrets.ACCEPTANCE_CUSTOMER_A_EMAIL }}
          ACCEPTANCE_CUSTOMER_A_PASSWORD: ${{ secrets.ACCEPTANCE_CUSTOMER_A_PASSWORD }}
          ACCEPTANCE_CUSTOMER_B_EMAIL: ${{ secrets.ACCEPTANCE_CUSTOMER_B_EMAIL }}
          ACCEPTANCE_CUSTOMER_B_PASSWORD: ${{ secrets.ACCEPTANCE_CUSTOMER_B_PASSWORD }}
          ACCEPTANCE_OWNER_A_EMAIL: ${{ secrets.ACCEPTANCE_OWNER_A_EMAIL }}
          ACCEPTANCE_OWNER_A_PASSWORD: ${{ secrets.ACCEPTANCE_OWNER_A_PASSWORD }}
          ACCEPTANCE_OWNER_B_EMAIL: ${{ secrets.ACCEPTANCE_OWNER_B_EMAIL }}
          ACCEPTANCE_OWNER_B_PASSWORD: ${{ secrets.ACCEPTANCE_OWNER_B_PASSWORD }}
          ACCEPTANCE_PARTNER_A_EMAIL: ${{ secrets.ACCEPTANCE_PARTNER_A_EMAIL }}
          ACCEPTANCE_PARTNER_A_PASSWORD: ${{ secrets.ACCEPTANCE_PARTNER_A_PASSWORD }}
          ACCEPTANCE_PARTNER_B_EMAIL: ${{ secrets.ACCEPTANCE_PARTNER_B_EMAIL }}
          ACCEPTANCE_PARTNER_B_PASSWORD: ${{ secrets.ACCEPTANCE_PARTNER_B_PASSWORD }}
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: ${{ secrets.PLAYWRIGHT_CHROMIUM_EXECUTABLE }}
        run: |
          npm run test:phase14:e2e

      - name: Upload Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase14-e2e-results-${{ github.run_id }}
          path: test-results/
          retention-days: 7

  summary:
    name: Phase 14 Summary
    needs: [validate-environment, integration-tests, e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Phase 14 Live Acceptance Test Execution" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** Execution completed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Results" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment Validation: \${{ needs.validate-environment.result }}"
          echo "- Integration Tests: \${{ needs.integration-tests.result }}"
          echo "- E2E Tests: \${{ needs.e2e-tests.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Notes" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tests execute only when all required secrets are configured" >> "$GITHUB_STEP_SUMMARY"
          echo "- BLOCKED status is reported when credentials or browser are unavailable" >> "$GITHUB_STEP_SUMMARY"
          echo "- No secrets are printed in logs or reports" >> "$GITHUB_STEP_SUMMARY"
