name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  dependency-installation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --ignore-scripts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run lint

  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run test:contracts 2>&1 | tee contract-tests.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-log
          path: contract-tests.log

  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run test:security 2>&1 | tee security-tests.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-log
          path: security-tests.log

  phase14-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run test:phase14:contracts 2>&1 | tee phase14-contracts.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase14-contract-log
          path: phase14-contracts.log

  production-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXORA_CUSTOMER_PWA_ORIGIN: ${{ secrets.NEXORA_CUSTOMER_PWA_ORIGIN }}
      NEXORA_OWNER_PWA_ORIGIN: ${{ secrets.NEXORA_OWNER_PWA_ORIGIN }}
      NEXORA_PARTNER_PWA_ORIGIN: ${{ secrets.NEXORA_PARTNER_PWA_ORIGIN }}
      NEXORA_TEMPLATE_PWA_ORIGIN: ${{ secrets.NEXORA_TEMPLATE_PWA_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Verify required build configuration
        run: |
          missing=()
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXORA_CUSTOMER_PWA_ORIGIN NEXORA_OWNER_PWA_ORIGIN NEXORA_PARTNER_PWA_ORIGIN; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            echo "Missing required GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi
      - run: npm run build 2>&1 | tee production-build.log
      - run: node --test tests/rendered-html.test.mjs 2>&1 | tee rendered-output.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-log
          path: |
            production-build.log
            rendered-output.log
            .next/trace

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: npm run scan:secrets
